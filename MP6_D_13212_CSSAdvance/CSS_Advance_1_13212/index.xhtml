<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>Formulir Pendaftaran Online Lomba KSL</title>
        <link rel="stylesheet" href="style.css" type="text/css" />
    </head>
    <body id = "body">
        <h1 id = "heading">
            Pendaftaran Lomba Kelompok Studi Linux UAJY
            <img src="logo.png" alt = "Pinguin" height = "100px" width = "100px"/>
        </h1>
        <form action="" method="post" enctype="multipart/form-data">
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td id = "label">
                        <label for="namatim">
                            <strong>Identitas Tim</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="namatim" name="namatim" size="30"/>
                    </td>
                </tr>
                <tr>
                    <td id = "label">
                        <label for="ketua">
                            <strong>Ketua Tim</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="ketua" name="ketua" size="30"/>
                    </td>
                </tr>
                <tr>
                    <td id = "label">
                        <label for="jumlah">
                            <strong>Total Anggota</strong>
                        </label>
                    </td>
                    <td>
                        <select id="jumlah" name="jumlah">
                            <option>1 Anggota</option>
                            <option>2 Anggota</option>
                            <option>3 Anggota</option>
                            <option>4 Anggota</option>
                            <option>5 Anggota</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td id = "label">
                        <label for="telepon">
                            <strong>Nomor Kontak</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="telepon" name="telepon" size="30"/>
                    </td>
                </tr>

                <tr>
                    <td id = "label">
                        <label for="instansi">
                            <strong>Asal Instansi</strong>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="instansi" name="instansi" size="30"/>
                    </td>
                </tr>
                <tr>
                    <td style="vertical-align: top;" id = "label">
                        <strong>Bidang Perlombaan</strong>
                    </td>
                    <td>
                        <p>
                            <input type="checkbox" id="coding" name="bidang" value="coding"/>
                            <label for="coding">Programming</label>
                            <input type="checkbox" id="desain" name="bidang" value="desain"/>
                            <label for="desain">UI/UX Design</label>
                        </p>
                        <p>
                            <input type="checkbox" id="video" name="bidang" value="video"/>
                            <label for="video">Video Competition</label>
                            <input type="checkbox" id="essay" name="bidang" value="essay"/>
                            <label for="essay">Short Essay Competition</label>
                        </p>
                    </td>
                </tr>
                <tr>
                    <td id = "label">
                        <strong>Tipe Peserta</strong>
                    </td>
                    <td>
                        <input type="radio" id="mahasiswa" name="peserta" value="mahasiswa"/>
                        <label for="mahasiswa">Mahasiswa</label>
                        <input type="radio" id="umum" name="peserta" value="umum"/>
                        <label for="umum">Umum</label>
                    </td>
                </tr>
                <tr>
                    <td id = "label">
                        <label for="deskripsi">
                            <strong>Deskripsi Singkat Karya</strong>
                        </label>
                    </td>
                    <td>
                        <textarea id="deskripsi" name="deskripsi" rows="10" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td id = "label">
                        <label for="alasan">
                            <strong>Alasan Mendaftar</strong>
                        </label>
                    </td>
                    <td>
                        <textarea id="alasan" name="alasan" rows="7" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td id = "label">
                        <label for="filekarya">
                            <strong>Pengumpulan Karya</strong>
                        </label>
                    </td>
                    <td>
                        <input type="file" id="filekarya" name="filekarya" accept="application/pdf, image/jpeg, image.png"/>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;" id="submit">
                        <input type="submit" name="daftar" value="Daftar" />
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
