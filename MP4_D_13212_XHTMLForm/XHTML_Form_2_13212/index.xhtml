<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title>Formulir Pendaftaran Kegiatan</title>
    </head>
    <body>
        <h1>Formulir Pendaftaran Kegiatan</h1>

        <form method="post" action="">
            <h2>Data Pendaftar</h2>
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td style="width:32%;"><b>Nama Lengkap</b></td>
                    <td><input type="text" name="nama" /></td>
                </tr>
                <tr>
                    <td style="width:32%;"><b>NIM</b></td>
                    <td><input type="text" name="nim" /></td>
                </tr>
                <tr>
                    <td style="width:32%;"><b>Program Studi</b></td>
                    <td>
                        <select name="prodi">
                            <option value="Informatika">Informatika</option>
                            <option value="Sistem Informasi">Sistem Informasi</option>
                            <option value="Teknik Industri">Teknik Industri</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;"><b>Jenis Kelamin</b></td>
                    <td>
                        <input type="radio" name="jk" value="Laki-laki" /> Laki-laki 
                        <input type="radio" name="jk" value="Perempuan" /> Perempuan
                    </td>
                </tr>
            </table>
            <h2>Pilihan Kegiatan</h2>
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td style="width:32%;"><b>Jenis Kegiatan</b></td>
                    <td>
                        <input type="radio" name="jenis_kegiatan" value="Seminar" /> Seminar 
                        <input type="radio" name="jenis_kegiatan" value="Pelatihan" /> Pelatihan 
                        <input type="radio" name="jenis_kegiatan" value="Diskusi" /> Diskusi
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;"><b>Bidang Minat</b></td>
                    <td>
                        <input type="checkbox" name="minat" value="Teknologi" /> Teknologi<br /><br />
                        <input type="checkbox" name="minat" value="Organisasi" /> Organisasi<br /><br />
                        <input type="checkbox" name="minat" value="Karier" /> Karier
                    </td>
                </tr>
                <tr>
                    <td style="width:32%;"><b>Waktu Kegiatan</b></td>
                    <td>
                        <select name="waktu">
                            <option value="Pagi">Pagi</option>
                            <option value="Siang">Siang</option>
                            <option value="Sore">Sore</option>
                        </select>
                    </td>
                </tr>
            </table>
            <h2>Kelengkapan Pendaftaran</h2>
            <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
                <tr>
                    <td style="width:32%;"><b>Harapan Mengikuti Kegiatan</b></td>
                    <td><textarea name="harapan" rows="8" cols="30"></textarea></td>
                </tr>
                <tr>
                    <td style="width:32%;"><b>Bukti Pembayaran</b></td>
                    <td><input type="file" name="bukti" /></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" value="Kirim" />
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
